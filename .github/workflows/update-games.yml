name: Update public Switch catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: public-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_public_catalog.py
      - run: python scripts/update_games.py
      - run: python scripts/verify_public_catalog.py
      - name: Publish validated catalog if changed
        run: |
          if git diff --quiet -- catalog/games.json && git ls-files --error-unmatch catalog/games.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- catalog/games.json
          git commit -m "Update public Switch game catalog"
          git push origin "HEAD:${GITHUB_REF_NAME}"
